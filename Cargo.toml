[package]
name = "RustBCA"
version = "3.0.0"
default-run = "RustBCA"
authors = ["Jon Drobny <drobny2@illinois.edu>", "Jon Drobny <jdrobny@tae.com>"]
edition = "2024"

[[bin]]
name = "RustBCA"
path = "src/main.rs"

[lib]
name = "libRustBCA"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[dependencies]
rand = {version = "0.10.2", features=["chacha"]}
rand_distr = "0.6.0"
toml = "1.1.4"
anyhow = "1.0.71"
itertools = "0.15.0"
rayon = "1.10.0"
geo = {version = "0.25", optional = false}
indicatif = {version = "0.18.6", features=["rayon"]}
serde = { version = "1.0.163", features = ["derive"] }
rcpr = { git = "https://github.com/drobnyjt/rcpr", branch="trucnation_fixes", optional=true}
ndarray = {version = "0.17.2", features = ["serde"], optional = true}
parry3d-f64 = {optional = true, version="0.2.0"}
pyo3 = {version = "0.29.0", optional=true}
pythonize = {version = "0.29.0", optional=true}

[dev-dependencies]
float-cmp = "0.10.0"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false

[features]
cpr_rootfinder = ["rcpr"]
distributions = ["ndarray"]
no_list_output = []
parry3d = ["parry3d-f64"]
python = ["pyo3", "pythonize", "rcpr"]